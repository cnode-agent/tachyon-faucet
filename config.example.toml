# Paths are relative to this config file. Keep private data outside the checkout.
devtool = "/home/ubuntu/zcash-devtool/target/release/zcash-devtool"
wallet_dir = "/home/ubuntu/tachyon-faucet-data/wallet"
state_dir = "/home/ubuntu/tachyon-faucet-data/state"
host = "127.0.0.1"
port = 4142
allowed_origins = ["https://tachyscan.cnode.phd"]
# Trust only the local nginx proxy; it must overwrite X-Real-IP with $remote_addr.
# For direct connections without a reverse proxy, use [].
trusted_proxy_ips = ["127.0.0.1", "::1"]

amount_zat = 1000000             # 0.01 testnet ZEC per claim; faucet pays fees
cooldown_seconds = 300          # One accepted claim per IP every five minutes
pow_difficulty_bits = 7         # Equihash solution target; +1 doubles expected work
pow_challenge_seconds = 600     # Time to solve and submit a challenge
auto_shield = true
shield_amount_zat = 100000000    # Refill with 1 ZEC when no spendable note is large enough
poll_seconds = 15
command_timeout = 1800
# Oblivious Synchronization Service. Without oss_url, devtool proves locally.
# oss_url = "http://127.0.0.1:8240"
# oss_cookie_file = "/path/to/oss/.cookie"
